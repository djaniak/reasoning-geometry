  # ── Trajectory probe — Track A (functional PCA on Mahalanobis sequence) ──
  # Resamples the per-token Mahalanobis distance to a fixed-length grid,
  # flattens it, fits PCA on the train fold, uses PC coefficients as features.
  # Ablation row: fpca_mahal only (no entropy channel, no probseq).
  # PYTHONPATH must include src/trajectory so trajectory_encoders /
  # trajectory_preprocessing are importable alongside repo-root analyze.py.

  trajectory_qwen_math500:
    cmd: >-
      PYTHONPATH=.
      uv run python probe.py
      --data_dir data/qwen/math500
      --output_dir results/qwen/math500_trajectory
      --dataset_label math500
      --layers 7,14,21
      --pca_dim ${analyze.pca_dim}
      --target_len ${trajectory.target_len}
      --methods ${trajectory.methods}
    deps:
      - probe.py
      - trajectory_encoders.py
      - trajectory_preprocessing.py
      - analyze.py
      - data/qwen/math500
    params:
      - analyze.pca_dim
      - trajectory.target_len
      - trajectory.methods
    metrics:
