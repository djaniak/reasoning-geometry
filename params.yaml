# Active, CPU-first pipeline parameters. Historical experiments remain under
# results/ and are described in EXPERIMENT_LOG.md, but are not default stages.

models:
  qwen:
    name: Qwen/Qwen2.5-7B-Instruct
    max_new_tokens: 1024
  qwen_dense:
    name: Qwen/Qwen2.5-7B-Instruct
    max_new_tokens: 1024

datasets:
  gsm8k:
    hf_path: openai/gsm8k
    hf_name: main
    split: test
  math500:
    hf_path: HuggingFaceH4/MATH-500
    hf_name: null
    split: test
  # Second prompt set, queued 2026-08-10. Text-only open-ended olympiad math,
  # \boxed{} answers, so the frozen parse/vote machinery carries over. The
  # answerability filter in collect_data.py keeps 501 of 674 rows.
  olympiadbench:
    hf_path: Hothan/OlympiadBench
    hf_name: OE_TO_maths_en_COMP
    split: train

collect:
  batch_save_size: 50

analyze:
  pca_dim: 128
  cv_random_state: 42

# Qwen gsm8k baseline. Data already collected (full test split); the cmd for
# this row must stay byte-identical to keep the DVC cache hit — do not add
# flags here. New models live in collect_arch_matrix instead.
collect_qwen_arch_matrix:
  - {model: qwen, dataset: gsm8k, model_name: Qwen/Qwen2.5-7B-Instruct, max_new_tokens: 1024}

# New-model single-sample greedy gsm8k collects (per-arch layers, probe-sized
# budgets from replication planning: deepseek 8192, deepseek_llama 12288).
collect_arch_matrix:
  - {model: deepseek, dataset: gsm8k, model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B, max_new_tokens: 8192, layers: "7,14,21", limit: 500, group_problems: 8}
  - {model: deepseek_llama, dataset: gsm8k, model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B, max_new_tokens: 12288, layers: "8,16,24", limit: 500, group_problems: 8}

# gsm8k only; no single-sample math500 (best-of-8 math500 data supersedes it).
analyze_matrix:
  - {model: qwen, dataset: gsm8k, n_bootstrap: 0}
  - {model: deepseek, dataset: gsm8k, n_bootstrap: 0}
  - {model: deepseek_llama, dataset: gsm8k, n_bootstrap: 0}

best_of_n:
  temperature: 0.6
  num_samples: 8

# math500 best-of-8 cells, split by collect status.
#
# The split exists because `frozen: true` in dvc.yaml applies to a whole foreach
# block. With a single list, unfreezing it to collect a new model also unfreezes
# the finished collects -- and collect_bestofn_full@0's recorded collect_data.py
# hash is already stale, so `dvc repro` would delete and regenerate 42 GB of Qwen
# traces that no remote can restore. Two lists keep the finished collects frozen
# while the new one stays reproducible.
#
#   bestofn_collected -> frozen collect stage; never reproduced
#   bestofn_pending   -> live collect stage; runs under `dvc repro`
#   bestofn_matrix    -> union; drives every downstream evaluation stage
#
# When a pending collect finishes and is committed, move its row to
# bestofn_collected and leave the bestofn_matrix order alone so the evaluation
# stage indices never shift. Qwen row first (index 0) — keep values
# byte-identical.
bestofn_collected:
  - &bestofn_qwen {model: qwen, scale: full, limit: 500, model_name: Qwen/Qwen2.5-7B-Instruct, max_new_tokens: 1024, layers: "7,14,21"}
  - &bestofn_deepseek {model: deepseek, scale: full, limit: 500, model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B, max_new_tokens: 8192, layers: "7,14,21"}
  # Retired from pending 2026-08-10: 80/80 batches on disk and every downstream
  # result already quotes it. It had to move before collect_data.py changed --
  # the live stage was showing `changed deps` against 259 GB that no remote can
  # restore. Collected 2026-07-31 as the cross-ARCHITECTURE replication of the
  # between-prompt/E1R results, which were n=2 and both Qwen-lineage.
  - &bestofn_deepseek_llama {model: deepseek_llama, scale: full, limit: 500, model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B, max_new_tokens: 12288, layers: "8,16,24"}

bestofn_pending:
  # Queued 2026-08-10. Second NON-distilled model: the distilled/non-distilled
  # split is currently n=1 on each side of the interesting contrast, so nothing
  # separates "distillation" from "Qwen". Llama-3.1-8B-Instruct is Llama-arch
  # like deepseek_llama but undistilled, at Qwen's 1024-token budget -- it
  # crosses the two factors that are presently confounded. Layers match
  # deepseek_llama so the two Llama-arch rows are read at the same depths.
  - &bestofn_llama {model: llama, scale: full, limit: 500, model_name: meta-llama/Llama-3.1-8B-Instruct, max_new_tokens: 1024, layers: "8,16,24"}

# Union; drives evaluate_prompt_decomposition. Append only -- an insert would
# shift the @N stage indices of finished cells.
bestofn_matrix:
  - *bestofn_qwen
  - *bestofn_deepseek
  - *bestofn_deepseek_llama
  - *bestofn_llama

# ── Second prompt set: olympiadbench ──────────────────────────────────────────
# Single-dataset scope is the binding constraint on breadth
# (PAPER_STRATEGY_RMD.md §7e; split out of PAPER_STRATEGY.md on 2026-08-15).
# Kept in its own matrices rather than folded into bestofn_*: those stages
# hardcode math500 in their paths, and rewriting their cmds would re-run three
# finished decompositions to reproduce byte-identical output.
#
# Gated on a probe. A prompt set only earns a Best-of-8 collect if its pass rate
# lands where abstention has both errors and successes to rank -- GSM8K is
# unusable at ~0.91, and olympiad problems can just as easily floor a 7B. The
# probe separates the three ways that can go wrong: genuinely hard, unparseable,
# or truncated at 1024 tokens. Read results/probe/ before running the collect.
probe_matrix:
  - {model: qwen, dataset: olympiadbench, model_name: Qwen/Qwen2.5-7B-Instruct, max_new_tokens: 1024, layers: "21", limit: 64}

# Qwen only to start: cheapest budget, and the probe's verdict decides whether
# the other two models are worth ~500 GB. 250 prompts x 8 samples ~= 22 GB.
bestofn_olympiad_pending:
  - &bestofn_olympiad_qwen {model: qwen, scale: full, dataset: olympiadbench, limit: 250, model_name: Qwen/Qwen2.5-7B-Instruct, max_new_tokens: 1024, layers: "7,14,21", expected_prompts: 250}

bestofn_olympiad_matrix:
  - *bestofn_olympiad_qwen

truncation_probe_matrix:
  - {name: deepseek, model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B, max_new_tokens: 8192, limit: 24, num_samples: 1, batch_size: 8}
  - {name: deepseek_llama, model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B, max_new_tokens: 12288, limit: 24, num_samples: 1, batch_size: 8}

prompt_decomposition:
  n: 8
  expected_prompts: 500
  n_splits: 5
  n_bootstrap: 1000
  seed: 42
  load_workers: 4
  contrastive_regions: "full,high_entropy_q20,tail_q20,random_q20"
  # Supervised LDA on PCA-projected region means -- the SEP-style baseline that
  # bounds how much of the geometry signal supervision on the same activations
  # can recover. Added 2026-07-29; its paired deltas are exploratory, not
  # pre-registered. random_q20 is omitted: it is a control for localization
  # claims, and the probe makes none.
  hidden_probe_regions: "full,high_entropy_q20,tail_q20"
  n_alignment_shuffles: 1000
  alignment_seed: 42
  region_seed: 42
  # Hidden states come from a bf16 forward pass, so float16 storage round-trips
  # losslessly (verified: Spearman 1.000000, pooled AUC delta 0.000000 vs float64
  # on qwen L21). Halves resident memory; float32 compute halves the reference-fit
  # concatenation. Required to fit the long-trace distill models in RAM.
  hidden_dtype: float16
  compute_dtype: float32
  # Cap on tokens concatenated to fit each reference manifold. The concat is the
  # pipeline's largest allocation and sklearn's PCA copies it to centre before
  # the randomized SVD, so peak is ~2x concat on top of the resident states.
  # Uncapped DeepSeek MATH-500 needs ~243 GB and gets OOM-killed.
  # 2M keeps peak near 140 GB. Qwen has ~0.6M correct-training tokens, so the cap
  # never binds there and its results stay bit-identical; DeepSeek still fits its
  # reference on ~3x the token budget Qwen used.
  max_reference_tokens: 2000000

wave1_experiments:
  n_bootstrap: 1000
  seed: 42
  pca_dim: 128
  load_workers: 4
  min_mixed_prompts: 30
  # Same memory profile as prompt_decomposition: wave1 refits the same reference
  # manifolds on the same traces. Values must match prompt_decomposition so both
  # stages score against identically-fit references.
  hidden_dtype: float16
  compute_dtype: float32
  max_reference_tokens: 2000000

# Qwen row first (index 0) — completed run; keep byte-identical.
# `abstention_layer` is the single deepest probed layer, which is where the
# incremental readout is fitted; it tracks `layers` per architecture rather than
# being a global constant, since the Llama-arch row does not probe 21.
wave1_matrix:
  - {model: qwen, scale: full, dataset: math500, layers: "7,14,21", abstention_layer: 21, max_new_tokens: 1024}
  - {model: deepseek, scale: full, dataset: math500, layers: "7,14,21", abstention_layer: 21, max_new_tokens: 8192}
  # Restored 2026-07-31 alongside the bestofn row; Llama-arch layers.
  - {model: deepseek_llama, scale: full, dataset: math500, layers: "8,16,24", abstention_layer: 24, max_new_tokens: 12288}
  # Queued 2026-08-10 alongside bestofn_pending. Append only; these rows are
  # @N-indexed and the three above are finished.
  - {model: llama, scale: full, dataset: math500, layers: "8,16,24", abstention_layer: 24, max_new_tokens: 1024}
  - {model: qwen, scale: full, dataset: olympiadbench, layers: "7,14,21", abstention_layer: 21, max_new_tokens: 1024}

# Region-matched output-confidence baselines (Gate A), calibration, and decision
# values. Seed and bootstrap count match wave1 so the shared prompt resampling is
# comparable across the two reports.
abstention_baselines:
  n_bootstrap: 1000
  seed: 42
  load_workers: 4
  # Folds for the out-of-fold logistic calibration. The unit is the prompt, so
  # plain stratified K-fold is already group-clean.
  n_splits: 5

# Prompt-held-out incremental abstention: does a tail-RMD feature add anything to
# the output-side readout B0? One seed across both models, so the increments are
# comparable; it matches abstention_baselines for the same reason that block
# matches wave1. The generation budget is not listed here on purpose -- it is
# resolved from dvc.lock/dvc.yaml per data directory, because a budget written
# beside a model name is the thing that silently mismatched before.
incremental_abstention:
  n_bootstrap: 1000
  seed: 42
  expected_traces: 8

summary:
  profile: current
